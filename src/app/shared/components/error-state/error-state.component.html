<div class="flex flex-col items-center justify-center py-12 px-4 text-center bg-red-50/50 rounded-lg border border-red-100">
  <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center text-3xl mb-4">
    <i class="pi pi-exclamation-circle"></i>
  </div>
  <h3 class="text-lg font-semibold text-red-800 mb-2">{{ title() }}</h3>
  @if (message()) {
    <p class="text-red-600 text-sm mb-6">{{ message() }}</p>
  } @else {
    <div class="mb-6"></div>
  }
  
  <p-button 
    label="Reintentar" 
    icon="pi pi-refresh" 
    styleClass="p-button-danger p-button-outlined" 
    (onClick)="handleRetry()">
  </p-button>
</div>
