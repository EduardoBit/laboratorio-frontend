<div class="page-container max-w-3xl mx-auto">
  <app-page-header [title]="pageTitle()" [subtitle]="editMode() ? 'Modifique los datos del médico' : 'Ingrese los datos del prescriptor'">
    <p-button label="Volver" icon="pi pi-arrow-left" styleClass="p-button-text p-button-secondary" routerLink="/medicos"></p-button>
  </app-page-header>

  <div class="card bg-white p-8 rounded-xl border border-gray-100 shadow-sm">
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
      
      <!-- Error global -->
      @if (errorMessage()) {
        <div class="p-4 mb-2 bg-red-50 border border-red-200 rounded-lg flex items-center gap-2 text-red-700 text-sm">
          <i class="pi pi-exclamation-triangle"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        
        <div class="flex flex-col gap-1 md:col-span-2">
          <label class="text-xs font-semibold text-gray-700">CMP (Colegio Médico) <span class="text-red-500">*</span></label>
          <input pInputText formControlName="cmp" maxlength="20" class="w-full md:w-1/2" />
          <p class="text-xs text-gray-400 mt-0.5">Ingrese el número de colegiatura del médico</p>
          @if (form.get('cmp')?.touched && form.get('cmp')?.hasError('required')) {
            <small class="text-red-500">El CMP es requerido.</small>
          }
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-gray-700">Nombres <span class="text-red-500">*</span></label>
          <input pInputText formControlName="nombres" class="w-full" />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-gray-700">Apellidos <span class="text-red-500">*</span></label>
          <input pInputText formControlName="apellidos" class="w-full" />
        </div>

        <div class="flex flex-col gap-1 md:col-span-2">
          <label class="text-xs font-semibold text-gray-700">Especialidad</label>
          <input pInputText formControlName="especialidad" class="w-full" placeholder="Ej: Medicina General, Dermatología..." />
        </div>

        <div class="flex flex-col gap-1 md:col-span-2">
          <label class="text-xs font-semibold text-gray-700">Teléfono</label>
          <input pInputText formControlName="telefono" maxlength="20" class="w-full md:w-1/2" />
        </div>

      </div>

      <div class="border-t border-gray-100 mt-4 pt-6 flex justify-end gap-3">
        <p-button 
          type="button" 
          label="Cancelar" 
          styleClass="p-button-text p-button-secondary" 
          routerLink="/medicos"
        ></p-button>
        <p-button 
          type="submit" 
          [label]="editMode() ? 'Actualizar' : 'Registrar'" 
          icon="pi pi-check" 
          [loading]="loading()"
        ></p-button>
      </div>

    </form>
  </div>
</div>
