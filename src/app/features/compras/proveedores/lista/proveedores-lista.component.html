<div class="page-container">
  <app-page-header title="Directorio de Proveedores" subtitle="Gestión de proveedores de insumos y materias primas">
    <p-button label="Nuevo Proveedor" icon="pi pi-plus" [routerLink]="['/compras/proveedores/nuevo']"></p-button>
  </app-page-header>

  <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm mb-6">
    <h2 class="text-sm font-bold text-gray-600 mb-4 uppercase tracking-wider">Filtros</h2>
    <form [formGroup]="filterForm" (ngSubmit)="filtrar()" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
      <div class="flex-1 flex flex-col gap-1 md:col-span-2">
        <label class="text-xs font-semibold text-gray-500">Razón Social</label>
        <input pInputText formControlName="razonSocial" placeholder="Razón Social" class="w-full" />
      </div>
      <div class="flex-1 flex flex-col gap-1">
        <label class="text-xs font-semibold text-gray-500">Estado</label>
        <select formControlName="estado" class="w-full p-inputtext bg-white border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">Todos</option>
          @for (est of estadoOptions; track est.value) {
            <option [value]="est.value">{{ est.label }}</option>
          }
        </select>
      </div>
      <div class="flex-1 flex flex-col gap-1 md:col-span-4">
        <div class="flex gap-3">
          <p-button type="submit" label="Buscar" icon="pi pi-search"></p-button>
          <p-button type="button" label="Limpiar" icon="pi pi-times" styleClass="p-button-text p-button-secondary" (onClick)="limpiarFiltros()"></p-button>
        </div>
      </div>
    </form>
  </div>

  @if (loading()) {
    <app-loading-state message="Cargando proveedores..." />
  } @else if (proveedores().length === 0) {
    <app-empty-state title="No se encontraron proveedores" message="Intente ajustar los filtros de búsqueda o registre un proveedor nuevo.">
      <p-button label="Nuevo Proveedor" icon="pi pi-plus" [routerLink]="['/compras/proveedores/nuevo']"></p-button>
    </app-empty-state>
  } @else {
    <div class="overflow-x-auto">
      <table class="w-full text-sm border border-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase">RUC</th>
            <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase">Razón Social</th>
            <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase">Estado</th>
            <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (proveedor of proveedores(); track proveedor.id) {
          <tr class="border-t border-gray-100 hover:bg-gray-50">
            <td class="px-6 py-4 font-medium text-gray-700">{{ proveedor.ruc }}</td>
            <td class="px-6 py-4 text-gray-700">{{ proveedor.razonSocial }}</td>
            <td class="px-6 py-4"><app-status-badge [status]="proveedor.estado" /></td>
            <td class="px-6 py-4 text-center">
              <div class="flex items-center justify-center gap-2">
                <p-button
                  icon="pi pi-pencil"
                  class="p-button-sm p-button-text p-button-primary"
                  (onClick)="editar(proveedor.id)"
                  pTooltip="Editar proveedor"
                  tooltipPosition="top">
                </p-button>
                <button
                  class="p-button-sm p-button-text"
                  [ngClass]="proveedor.estado === 'ACTIVO' ? 'p-button-danger' : 'p-button-success'"
                  (click)="confirmarCambioEstado(proveedor.id, proveedor.estado)"
                  pTooltip="{{ proveedor.estado === 'ACTIVO' ? 'Inactivar proveedor' : 'Activar proveedor' }}"
                  tooltipPosition="top">
                  <i [ngClass]="proveedor.estado === 'ACTIVO' ? 'pi pi-ban' : 'pi pi-check'"></i>
                </button>
              </div>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>

    <p-paginator [rows]="size()" [totalRecords]="totalElements()" [first]="first()" [rowsPerPageOptions]="[5, 10, 20, 50]" [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}" (onPageChange)="onPageChange($event)"></p-paginator>
  }

  <app-confirm-dialog
    [visible]="confirmVisible()"
    (visibleChange)="confirmVisible.set($event)"
    title="Cambiar estado de proveedor"
    [message]="'¿Está seguro de cambiar el estado a ' + (confirmEstado() === 'ACTIVO' ? 'ACTIVO' : 'INACTIVO') + '?'"
    [confirmLabel]="'Cambiar'"
    [cancelLabel]="'Cancelar'"
    (onConfirm)="ejecutarCambioEstado()"
    (onCancel)="cancelarConfirm()"
  />
</div>
