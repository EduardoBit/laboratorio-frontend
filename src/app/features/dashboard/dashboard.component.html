<div class="dashboard-container">
  
  <div class="dashboard-header">
    <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Panel General</h1>
    <p class="text-gray-500 text-sm mt-1">Resumen operativo del laboratorio</p>
  </div>

  <!-- Tarjetas de métricas (Grid responsive) -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 mt-6">
    
    @for (metric of metrics(); track metric.label) {
      <div 
        class="metric-card bg-white border border-gray-100 rounded-xl p-5 flex items-center gap-4 shadow-sm cursor-pointer transition-all"
        [routerLink]="metric.route"
      >
        <!-- Ícono -->
        <div class="w-12 h-12 rounded-full flex items-center justify-center text-xl shrink-0" [ngClass]="metric.colorClass">
          <i [class]="metric.icon"></i>
        </div>
        
        <!-- Valores -->
        <div class="flex-1 min-w-0">
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider truncate">{{ metric.label }}</h3>
          <p class="text-2xl font-bold text-gray-800 mt-0.5">{{ metric.value }}</p>
        </div>
      </div>
    }

  </div>

  <!-- Placeholder para futuros gráficos de la Fase 16 (Reportes) -->
  <div class="mt-8 border-t border-gray-200 pt-8">
    <div class="flex items-center justify-center h-48 bg-gray-50 border border-dashed border-gray-300 rounded-xl text-gray-400">
      <div class="text-center">
        <i class="pi pi-chart-line text-3xl mb-2"></i>
        <p class="text-sm font-medium">Gráficos de tendencia (Fase 16)</p>
      </div>
    </div>
  </div>

</div>
